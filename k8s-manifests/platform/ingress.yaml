apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: multi-tenant-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 2026-10-06 (user decision): the platform UI + /api (which create/delete tenant
    # namespaces through the Kubernetes API) were served to the internet with no
    # authentication. Gated by the shared admin basic-auth Middleware (Traefik,
    # kube-system; users from Doppler TRAEFIK_DASHBOARD_HTPASSWD) plus the CrowdSec
    # bouncer. Both hostnames and both path prefixes get it.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd,kube-system-admin-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: k8s-platform.el-jefe.me
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: platform-backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: platform-frontend
            port:
              number: 80
  # tenantflow.el-jefe.me is the original public hostname — kept as an alias
  # of the platform UI (it used to point at a long-gone tenantflow-frontend
  # in the default namespace via portfolio-orchestration-ingress).
  - host: tenantflow.el-jefe.me
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: platform-backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: platform-frontend
            port:
              number: 80
  tls:
  - hosts:
    - k8s-platform.el-jefe.me
    - tenantflow.el-jefe.me
    secretName: platform-tls
---
# /logout for the Basic-auth admin login (both hosts). Guarded by
# kube-system/admin-basic-auth-logout (same realm, never-matching user list)
# so it always returns 401 and the browser drops the cached credential.
# Higher priority than the catch-all frontend path. 2026-10-06.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-logout
  namespace: multi-tenant-platform
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`tenantflow.el-jefe.me`) || Host(`k8s-platform.el-jefe.me`)) && Path(`/logout`)
      kind: Rule
      priority: 300
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
        - name: admin-basic-auth-logout
          namespace: kube-system
      services:
        - name: platform-frontend
          port: 80
  tls:
    secretName: platform-tls
