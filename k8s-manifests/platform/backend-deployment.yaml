apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
  namespace: multi-tenant-platform
  labels:
    app: platform-backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-backend
  template:
    metadata:
      labels:
        app: platform-backend
        component: api
    spec:
      # 2026-10-07: soft spread of the 2 replicas across nodes (ScheduleAnyway:
      # prefers different hostnames, never blocks scheduling, pins nothing).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: platform-backend
      serviceAccountName: platform-backend-sa
      containers:
      - name: backend
        image: maxjeffwell/tenantflow-backend:20261006-165922-2a9a402
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        # Self-hosted Neon pageserver for tenant branching.
        # Tenant apps are served at <tenant>.tenants.el-jefe.me by Traefik
        # (wildcard cert tenants-wildcard-tls, wildcard DNS -> edge).
        - name: INGRESS_DOMAIN
          value: "tenants.el-jefe.me"
        - name: INGRESS_CLASS
          value: "traefik"
        - name: PAGESERVER_URL
          value: "http://tenantflow-neon-neon-pageserver-headless.neon.svc.cluster.local:9898"
        # Template every tenant branch forks from (main timeline, built by
        # neon-template-bootstrap.yaml).
        - name: NEON_TEMPLATE_TENANT_ID
          value: "77a948ddeeb9fc8fd31daad9bdc4bea7"
        - name: NEON_TEMPLATE_TIMELINE_ID
          value: "01ee6c87fb000f298c1b0b0904ca461e"
        resources:
          requests:
            # 50m not 100m: 7-day p50 across all 7 replicas ranges 2.9-19.2m, so
            # 100m reserved ~5x typical usage on every node one lands on. The 500m
            # limit still covers bursts -- requests never cap CPU, they only reserve.
            # Memory deliberately left at 128Mi: 7-day peak is 119Mi, already correct.
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: platform-backend
  namespace: multi-tenant-platform
  labels:
    app: platform-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: platform-backend
---
# Alias Service: the platform-frontend image's nginx config hardcodes
# upstream "tenantflow-backend" (image was built against an older Service
# name). Rather than rebuild the image, expose the same backend pods under
# both names. Same selector, same endpoints.
# See memory: service-alias-for-upstream-typos
apiVersion: v1
kind: Service
metadata:
  name: tenantflow-backend
  namespace: multi-tenant-platform
  labels:
    purpose: nginx-upstream-alias
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: platform-backend
